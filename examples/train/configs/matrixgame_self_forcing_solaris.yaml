# MatrixGame Solaris Self-Forcing DMD Distillation
#
# - Student: CausalMatrixGameWanModel (trainable, self-forcing causal)
# - Teacher: MatrixGameWanModel (frozen, non-causal)
# - Critic:  MatrixGameWanModel (trainable, non-causal)
# - Training: streaming rollout with SDE sampling, diagonal denoising

models:
  student:
    _target_: fastvideo.train.models.matrixgame.MatrixGameCausalModel
    init_from: /mnt/weka/home/hao.zhang/kaiqin/mg_models/Solaris-SF-30K-8K-18K
    trainable: true
    flow_shift: 5.0
  teacher:
    _target_: fastvideo.train.models.matrixgame.MatrixGameModel
    init_from: /mnt/weka/home/hao.zhang/kaiqin/mg_models/Solaris-30K-8K-18K
    trainable: false
    disable_custom_init_weights: true
    flow_shift: 5.0
  critic:
    _target_: fastvideo.train.models.matrixgame.MatrixGameModel
    init_from: /mnt/weka/home/hao.zhang/kaiqin/mg_models/Solaris-30K-8K-18K
    trainable: true
    disable_custom_init_weights: true
    flow_shift: 5.0

method:
  _target_: fastvideo.train.methods.distribution_matching.self_forcing.SelfForcingMethod
  rollout_mode: simulate
  generator_update_interval: 5
  real_score_guidance_scale: 3.0
  dmd_denoising_steps: [1000, 100]
  warp_denoising_step: true
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98

  # Diagonal denoising warmup
  use_diagonal_denoising: true
  diagonal_warmup_mid_steps: [750, 500]

  # Self-forcing config
  chunk_size: 3
  student_sample_type: sde
  context_noise: 0.0
  same_step_across_blocks: true
  last_step_only: false
  enable_gradient_in_rollout: true
  start_gradient_frame: 0

  # Critic optimizer
  fake_score_learning_rate: 3e-7
  fake_score_betas: [0.9, 0.95]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8

  data:
    data_path: /mnt/weka/home/hao.zhang/kaiqin/solaris/datasets/train_81f
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 21
    num_height: 352
    num_width: 640
    num_frames: 81

  optimizer:
    learning_rate: 3e-6
    betas: [0.9, 0.95]
    weight_decay: 0
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 1000
    gradient_accumulation_steps: 4

  checkpoint:
    output_dir: outputs/matrixgame_sf_solaris
    training_state_checkpointing_steps: 400
    weight_only_checkpointing_steps: 400
    checkpoints_total_limit: 3

  tracker:
    project_name: matrixgame_sf
    run_name: matrixgame_sf_solaris

  model:
    dit_precision: fp32
    # NOTE: enable_gradient_checkpointing_type: full crashes due to
    # action KV cache incompatibility with gradient recomputation.
    # See known issues in dev/mg_solaris_summary.md.

callbacks:
  grad_clip:
    max_grad_norm: 1.0
  ema:
    decay: 0.99
    start_step: 200
  validation:
    pipeline_target: fastvideo.pipelines.basic.matrixgame.matrixgame_causal_dmd_pipeline.MatrixGameCausalDMDPipeline
    dataset_file: examples/distill/MatrixGame2.0/validation.json
    every_steps: 200
    sampling_steps: [4]
    guidance_scale: 6.0

pipeline:
  flow_shift: 5
