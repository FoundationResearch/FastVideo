# V3 config: WanGame causal Diffusion-Forcing SFT (DFSFT).
#
# Uses _target_-based instantiation — each model role is an independent
# class instance; the method class is resolved directly from the YAML.

models:
  student:
    _target_: fastvideo.train.models.wangame.WanGameCausalModel
    init_from: /mnt/data/world_model/WanGame-2.1-0325-60k-steps
    trainable: true
    # transformer_override_safetensor: /mnt/data/world_model/zelda_runs/wangame_1.3b_zelda_wasd_with_warm_up/checkpoint-60000/transformer/diffusion_pytorch_model.safetensors

method:
  _target_: fastvideo.train.methods.fine_tuning.dfsft.DiffusionForcingSFTMethod
  attn_kind: dense
  # use_ema: true
  chunk_size: 3
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98

training:
  distributed:
    num_gpus: 32
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 32

  data:
    data_path: >-
      /mnt/data/world_model/zelda-wasd-only:1,
      /mnt/data/world_model/zelda_data/zeldam2-v2:1
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 9
    num_height: 480
    num_width: 832
    num_frames: 33
    apply_bot_died_filter: false

  optimizer:
    learning_rate: 1e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-5
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 60000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /mnt/data/world_model/zelda_runs/wangame_dfsft_zelda
    training_state_checkpointing_steps: 5000
    weight_only_checkpointing_steps: 5000
    checkpoints_total_limit: 10
    best_checkpoint_start_step: 1500
    best_checkpoint_top_k: 10

  tracker:
    project_name: distillation_wangame_r
    run_name: zelda_dfsft_clean_data

  model:
    enable_gradient_checkpointing_type: null
    precondition_outputs: false

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  # ema:
  #   _target_: fastvideo.train.callbacks.ema.EMACallback
  #   beta: 0.9999
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.wan.wangame_causal_dmd_pipeline.WangameCausalOdeDMDPipeline
    dataset_file: examples/training/finetune/WanGame2.1_1.3b_i2v/validation_zelda.json
    every_steps: 500
    sampling_steps: [40]
    scheduler_target: fastvideo.models.schedulers.scheduling_flow_match_euler_discrete.FlowMatchEulerDiscreteScheduler
    guidance_scale: 1.0
    num_frames: 33
    evaluate_ptlflow: true
    ptlflow_dir: /mnt/home/mhuo/ptlflow

pipeline:
  flow_shift: 3
