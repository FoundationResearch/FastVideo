<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dreamverse · Prompt Evolution</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#141925; --panel2:#1b2230; --ink:#e7ecf3; --muted:#8a96a8;
    --accent:#5db0ff; --good:#39d98a; --warn:#ffb454; --line:#273040;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
  header .meta{color:var(--muted);font-size:12.5px}
  header .meta b{color:var(--ink);font-weight:600}
  .mock{margin-left:auto;background:#3a2a12;color:var(--warn);padding:4px 10px;border-radius:6px;font-size:12px;border:1px solid #5a3f17}
  main{padding:20px 24px;max-width:1500px;margin:0 auto}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:26px 0 12px}
  /* hero strip */
  .hero{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
  .hero .gcard{flex:0 0 220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .hero .gcard video{width:100%;display:block;background:#000;aspect-ratio:16/9;object-fit:cover}
  .hero .gcap{padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
  .hero .gen{color:var(--muted);font-size:12px}
  .arrow{align-self:center;color:var(--muted);flex:0 0 auto}
  .score{font-variant-numeric:tabular-nums;font-weight:700}
  .score.big{font-size:15px}
  /* chart */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  #trendWrap{height:240px}
  /* controls */
  .controls{display:flex;gap:8px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
  .controls button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .controls button.active{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
  /* candidate grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card.best{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
  .card video{width:100%;display:block;background:#000;aspect-ratio:16/9;object-fit:cover}
  .card .body{padding:12px 13px;display:flex;flex-direction:column;gap:9px}
  .card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cid{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
  .badge{background:var(--good);color:#04130b;border-radius:6px;padding:2px 8px;font-weight:700;font-variant-numeric:tabular-nums}
  .best .badge{background:var(--good)}
  .bars{display:flex;flex-direction:column;gap:5px}
  .bar{display:grid;grid-template-columns:120px 1fr 38px;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .track{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#2c7a55,var(--good))}
  .bar .v{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .mut{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  .lin{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted)}
  select#runSel{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px}
  .pbtn{background:var(--panel2);border:1px solid var(--line);color:var(--accent);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;align-self:flex-start}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .modal.open{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:1000px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
  .modal .x{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
  .modal h3{margin:0;font-size:15px}
  .modal .close{cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .modal pre{white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;color:#cdd6e4;max-height:42vh;overflow:auto}
  .modal .seg{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12.5px;color:#cdd6e4}
  .modal .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px}
  .detail-video{width:100%;max-height:48vh;background:#000;border-radius:10px}
  .uprompt{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;font-size:13px}
  .mrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .mrow .m{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:#cdd6e4}
  .mrow .m b{color:var(--good)}
  .toggle{display:inline-flex;gap:6px;margin:2px 0 8px}
  .toggle button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 11px;font-size:12px;cursor:pointer}
  .toggle button.on{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
  .diff{white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:46vh;overflow:auto}
  .diff .add{background:#11331c;color:#86e6ab;display:block}
  .diff .del{background:#3a1717;color:#ff9b9b;display:block}
  .diff .ctx{color:#7c879a;display:block}
  .card{cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Dreamverse · System-Prompt Evolution</h1>
  <select id="runSel" title="project / run"></select>
  <div class="meta" id="meta"></div>
  <div class="mock" id="mockTag" style="display:none">MOCK DATA</div>
</header>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="box">
    <div class="x"><h3 id="mTitle"></h3><span class="close" onclick="closeModal()">×</span></div>
    <div id="mBody"></div>
  </div>
</div>
<main>
  <div class="section-title">Best rollout per generation — watch quality climb →</div>
  <div class="hero" id="hero"></div>

  <div class="section-title">Fitness over generations</div>
  <div class="panel"><div id="trendWrap"><canvas id="trend"></canvas></div></div>

  <div class="section-title">Candidates</div>
  <div class="controls" id="genControls"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const DIM_LABELS = {
  // lean VBench set (higher = better)
  prompt_consistency:"prompt consistency", subject_consistency:"subject consistency",
  aesthetic_quality:"aesthetic", dynamic_degree:"dynamic", quality_mean:"quality mean",
  // legacy lightweight scorer dims
  text_alignment:"text align", segment_consistency:"seg consistency",
  motion_smoothness:"motion smooth", temporal_flicker:"anti-flicker",
  sharpness:"sharpness", colorfulness:"colorfulness", seam_continuity:"seam"
};
let DATA=null, RUN=null, curGen="all", chart=null, lastSig="";

function sig(d){ return (d.generations||[]).reduce((s,g)=>s+"|"+g.candidates.length+":"
  +g.candidates.map(c=>c.combined_score).join(","),""); }

async function load(){
  const runs=(await (await fetch("/api/runs")).json()).runs;
  const want = new URL(location.href).searchParams.get("run");
  if(!RUN) RUN = (want && runs.includes(want)) ? want : (runs[0] || "mock");
  populateRuns(runs);
  const d = await (await fetch(`/runs/${RUN}/evolution.json?t=${Date.now()}`)).json();
  const s = sig(d)+"@"+RUN;
  if(s===lastSig) return;            // nothing changed
  lastSig = s; DATA = d;
  renderMeta(); renderHero(); renderTrend(); renderControls(); renderGrid();
}
function populateRuns(runs){
  const sel=document.getElementById("runSel");
  sel.innerHTML=runs.map(r=>`<option value="${r}">${r}</option>`).join("");
  sel.value=RUN;
  sel.onchange=()=>{ RUN=sel.value; lastSig=""; history.replaceState(null,"",`?run=${RUN}`); load(); };
}
async function boot(){
  await load();
  setInterval(()=>load().catch(()=>{}), 5000);   // live-refresh while a run is in progress
}
function vurl(v){ return `/runs/${RUN}/${v}`; }
function bestOf(g){ return g.candidates.reduce((a,b)=>a.combined_score>=b.combined_score?a:b); }

function renderMeta(){
  document.getElementById("meta").innerHTML =
    `target <b>${DATA.target}</b> · evolver <b>${DATA.evolver_model}</b> · task <b>${DATA.task_model}</b> · `+
    `dims <b>${(DATA.feature_dimensions||[]).join(" × ")}</b> · <b>${DATA.generations.length}</b> generations`;
  if(DATA.note && DATA.note.toLowerCase().includes("mock")) document.getElementById("mockTag").style.display="";
}
function renderHero(){
  const h=document.getElementById("hero"); h.innerHTML="";
  DATA.generations.forEach((g,i)=>{
    const b=bestOf(g);
    const c=document.createElement("div"); c.className="gcard";
    c.innerHTML=`<video src="${vurl(b.video)}" muted loop autoplay playsinline></video>
      <div class="gcap"><span class="gen">gen ${g.generation}</span>
      <span class="score big" style="color:var(--good)">${b.combined_score.toFixed(3)}</span></div>`;
    h.appendChild(c);
    if(i<DATA.generations.length-1){const a=document.createElement("div");a.className="arrow";a.textContent="→";h.appendChild(a);}
  });
}
function renderTrend(){
  const labels=DATA.generations.map(g=>`gen ${g.generation}`);
  const best=DATA.generations.map(g=>bestOf(g).combined_score);
  const mean=DATA.generations.map(g=>g.candidates.reduce((s,c)=>s+c.combined_score,0)/g.candidates.length);
  if(chart){ chart.destroy(); chart=null; }
  chart=new Chart(document.getElementById("trend"),{
    type:"line",
    data:{labels,datasets:[
      {label:"best",data:best,borderColor:"#39d98a",backgroundColor:"#39d98a22",tension:.3,fill:true,pointRadius:4},
      {label:"mean",data:mean,borderColor:"#5db0ff",backgroundColor:"#5db0ff11",tension:.3,fill:true,pointRadius:3,borderDash:[5,4]},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{suggestedMin:0.4,suggestedMax:1,grid:{color:"#27304055"},ticks:{color:"#8a96a8"}},
              x:{grid:{color:"#27304033"},ticks:{color:"#8a96a8"}}},
      plugins:{legend:{labels:{color:"#e7ecf3"}}}}
  });
}
function renderControls(){
  const c=document.getElementById("genControls"); c.innerHTML="";
  const mk=(label,val)=>{const b=document.createElement("button");b.textContent=label;
    b.className=val===curGen?"active":"";b.onclick=()=>{curGen=val;renderControls();renderGrid();};return b;};
  c.appendChild(mk("All","all"));
  DATA.generations.forEach(g=>c.appendChild(mk(`Gen ${g.generation}`,g.generation)));
}
function dimBars(m){
  return Object.keys(DIM_LABELS).filter(k=>k in m).map(k=>{
    const v=m[k];const pct=Math.round(v*100);
    return `<div class="bar"><span>${DIM_LABELS[k]}</span>
      <span class="track"><span class="fill" style="width:${pct}%"></span></span>
      <span class="v">${v.toFixed(2)}</span></div>`;
  }).join("");
}
function card(c,best){
  const el=document.createElement("div"); el.className="card"+(best?" best":"");
  el.innerHTML=`<video src="${vurl(c.video)}" muted loop autoplay playsinline></video>
    <div class="body">
      <div class="row"><span class="cid">${c.id}</span>
        <span class="badge">${c.combined_score.toFixed(3)}</span></div>
      <div class="row"><span class="tag">gen ${c.generation}</span>
        <span class="tag">island ${c.island}</span>
        <span class="tag">~${c.prompt_length} chars</span>
        ${best?'<span class="tag" style="color:var(--good);border-color:var(--good)">best</span>':''}</div>
      <div class="bars">${dimBars(c.metrics)}</div>
      <div class="mut">${c.mutation_summary}</div>
      <button class="pbtn">▸ open detail (video + sound + prompt diff)</button>
      <div class="lin">parent: ${c.parent_id||"— (seed)"}</div>
    </div>`;
  el.onclick=(e)=>{ if(e.target.tagName!=="VIDEO") showDetail(c); };  // video keeps its own controls
  return el;
}
// find the seed policy block of the current run (the gen-0 seed candidate)
function seedBlock(){
  if(DATA.seed_policy_block) return DATA.seed_policy_block;
  for(const g of DATA.generations) for(const c of g.candidates)
    if(c.parent_id==null || (c.mutation_summary||"").toLowerCase().includes("seed")) return c.policy_block||"";
  return "";
}
function metricRow(m){
  const fmt=(k)=> (k in m && m[k]!=null) ? `<span class="m">${k.replace(/_/g," ")} <b>${(+m[k]).toFixed?(+m[k]).toFixed(3):m[k]}</b></span>` : "";
  const keys=["quality_mean","prompt_consistency","dynamic_degree","subject_consistency","segment_consistency",
    "video_artifact_rate","video_severity_per_seam","audio_noise_score","squim_pesq","n_seams"];
  return `<div class="mrow">${keys.map(fmt).join("")}</div>`;
}
function lineDiff(seedTxt,candTxt){
  const a=(seedTxt||"").split("\n"), b=(candTxt||"").split("\n"), m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
    dp[i][j]= a[i]===b[j]? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out=[];
  const push=(cls,t)=>out.push(`<span class="${cls}">${cls==="add"?"+ ":cls==="del"?"- ":"  "}${escapeHtml(t)||"&nbsp;"}</span>`);
  while(i<m&&j<n){ if(a[i]===b[j]){push("ctx",a[i]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){push("del",a[i]);i++;} else {push("add",b[j]);j++;} }
  while(i<m)push("del",a[i++]); while(j<n)push("add",b[j++]);
  return `<div class="diff">${out.join("")}</div>`;
}
let _detail=null;
function showDetail(c){
  _detail=c;
  const seed=seedBlock(), cand=c.policy_block||"";
  const hasDiff = seed && cand;
  document.getElementById("mTitle").textContent = `${c.id} · gen ${c.generation} · score ${c.combined_score.toFixed(3)}`;
  const segs=(c.segments||[]).map((s,i)=>`<div class="seg"><b>segment ${i+1}</b><br>${escapeHtml(s)}</div>`).join("");
  const sp=c.system_prompt||c.prompt_excerpt||"(not recorded)";
  document.getElementById("mBody").innerHTML=
    `<video class="detail-video" src="${vurl(c.video)}" controls autoplay playsinline></video>`+
    `<div class="lbl">User prompt (idea fed to the rewriter)</div><div class="uprompt">${escapeHtml(DATA.eval_idea||DATA.note||"(n/a)")}</div>`+
    `<div class="lbl">Metrics</div>${metricRow(c.metrics||{})}`+
    `<div class="lbl">Rewritten 6 segment prompts → the video above</div>${segs||"<i>n/a</i>"}`+
    `<div class="lbl">System prompt policy</div>`+
    `<div class="toggle">`+
      `<button id="tgDiff" class="${hasDiff?'on':''}" ${hasDiff?'':'disabled'}>diff vs seed</button>`+
      `<button id="tgFull">full prompt</button></div>`+
    `<div id="spView">${hasDiff?lineDiff(seed,cand):`<pre>${escapeHtml(sp)}</pre>`}</div>`;
  if(hasDiff){
    document.getElementById("tgDiff").onclick=()=>{setTog(true);document.getElementById("spView").innerHTML=lineDiff(seed,cand);};
    document.getElementById("tgFull").onclick=()=>{setTog(false);document.getElementById("spView").innerHTML=`<pre>${escapeHtml(sp)}</pre>`;};
  } else { document.getElementById("tgFull").onclick=()=>{}; }
  document.getElementById("modal").classList.add("open");
}
function setTog(diffOn){ const d=document.getElementById("tgDiff"),f=document.getElementById("tgFull");
  if(d)d.classList.toggle("on",diffOn); if(f)f.classList.toggle("on",!diffOn); }
function closeModal(){ document.getElementById("modal").classList.remove("open");
  const v=document.querySelector("#mBody video"); if(v)v.pause(); }
function escapeHtml(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });
function renderGrid(){
  const grid=document.getElementById("grid"); grid.innerHTML="";
  const gens = curGen==="all" ? DATA.generations : DATA.generations.filter(g=>g.generation===curGen);
  gens.forEach(g=>{const b=bestOf(g);
    g.candidates.forEach(c=>grid.appendChild(card(c,c.id===b.id)));});
}
boot().catch(e=>{document.body.innerHTML="<pre style='padding:24px'>load error: "+e+"</pre>";});
</script>
</body>
</html>
